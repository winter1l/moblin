name: All

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 1660b84c3b3822c6630eeba622b06b3c62ff5f12
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
      - name: Brew update
        run: |
          brew update
      - name: Install tools
        run: |
          brew install just swiftformat swiftlint oxfmt oxlint codespell
      - name: Source code styling
        run: |
          just style-check
      - name: Linting
        run: |
          just lint
      - name: Spell checking
        run: |
          just spell-check
      - name: Web remote control frontend
        run: |
          just web-remote-control-frontend-prepare
          just web-remote-control-frontend-build
          git diff --exit-code

