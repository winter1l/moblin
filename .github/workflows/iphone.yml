name: CHZZK iPhone build
on:
  workflow_dispatch:
  push:
    branches: [iphone-build]
permissions:
  contents: read
jobs:
  iphone:
    if: "!contains(github.event.head_commit.message, '[tests only]')"
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v6
      - name: Save device preview changes
        run: cp .github/workflows/chzzk-device-preview.patch "$RUNNER_TEMP/device.patch"
      - uses: actions/checkout@v6
        with:
          ref: cf7ea657afea328407ccda469c299285fe60ca74
      - name: Apply device preview changes
        run: git apply "$RUNNER_TEMP/device.patch"
      - name: Build for iPhone
        run: |
          cp User.template.xcconfig Config/User.xcconfig
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain
          set -o pipefail
          xcodebuild -scheme Moblin -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" -onlyUsePackageVersionsFromResolvedFile CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build | xcbeautify
      - name: Package for personal signing
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/Moblin.app" Payload/
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' Payload/Moblin.app/Info.plist
          xcrun lipo -archs Payload/Moblin.app/Moblin
          ditto -c -k --keepParent Payload Moblin-CHZZK.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Moblin-CHZZK-iPhone
          path: Moblin-CHZZK.ipa
          retention-days: 14
  tests:
    if: "github.event_name != 'workflow_dispatch' && !contains(github.event.head_commit.message, '[iphone only]')"
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v6
      - run: cp .github/workflows/chzzk-device-preview.patch "$RUNNER_TEMP/device.patch"
      - uses: actions/checkout@v6
        with:
          ref: cf7ea657afea328407ccda469c299285fe60ca74
      - name: Apply tested changes
        run: git apply "$RUNNER_TEMP/device.patch"
      - name: Run Mac Catalyst tests
        run: |
          cp User.template.xcconfig Config/User.xcconfig
          xcodebuild -downloadComponent MetalToolchain
          set -o pipefail
          xcodebuild -scheme Moblin -destination 'platform=macOS,variant=Mac Catalyst' -onlyUsePackageVersionsFromResolvedFile -parallel-testing-enabled NO CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM='' CODE_SIGN_ENTITLEMENTS='' test | xcbeautify
      - name: Inspect test host after launch failure
        if: failure()
        run: |
          /usr/bin/log show --last 5m --style compact --predicate '(process == "amfid" OR process == "taskgated-helper" OR process == "kernel" OR process == "launchd") AND eventMessage CONTAINS[c] "Moblin"' | tail -60
          find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Debug-maccatalyst/Moblin.app' -exec codesign -d --entitlements - '{}' ';'
